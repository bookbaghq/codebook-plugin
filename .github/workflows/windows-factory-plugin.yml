name: Factory plugin on Windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read a transcript range with Git for Windows
        shell: pwsh
        run: |
          $gitBin = Split-Path (Get-Command git.exe).Source
          $usrBin = Join-Path (Split-Path $gitBin) 'usr/bin'
          $env:PATH = "$usrBin;$env:PATH"
          $sample = Join-Path $env:RUNNER_TEMP 'factory UTF8 sample.txt'
          [IO.File]::WriteAllText($sample, 'aébc', [Text.UTF8Encoding]::new($false))
          $file = $sample.Replace('\', '/')
          $range = & sh -c 'tail -c +"$1" "$2" | head -c "$3"' sh 4 $file 2
          if ($LASTEXITCODE -ne 0 -or "$range" -ne 'bc') { throw 'Incorrect UTF-8 byte range' }
      - name: Run the native Claude Code plugin tests
        shell: pwsh
        run: |
          $cli = Join-Path $env:RUNNER_TEMP 'factory-plugin-cli'
          npm install --prefix $cli --no-audit --no-fund @anthropic-ai/claude-code@2.1.325
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $claude = Join-Path $cli 'node_modules/.bin/claude.cmd'
          & $claude --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $claude plugin test .
          exit $LASTEXITCODE
      - name: Install the marketplace plugin and run its help command
        shell: pwsh
        run: |
          $claude = Join-Path $env:RUNNER_TEMP 'factory-plugin-cli/node_modules/.bin/claude.cmd'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'factory-user-profile'
          $env:CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = '1'
          $env:ANTHROPIC_BASE_URL = 'http://127.0.0.1:1'
          $env:ANTHROPIC_API_KEY = 'offline-test-fixture'
          $emptyMcp = Join-Path $env:RUNNER_TEMP 'factory-empty-mcp.json'
          Set-Content -LiteralPath $emptyMcp -Value '{"mcpServers":{}}' -Encoding utf8
          Set-Location $env:RUNNER_TEMP
          & $claude plugin marketplace add $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $claude plugin install codebook@codebook
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installed = & $claude plugin list --json | ConvertFrom-Json
          $package = Get-Content (Join-Path $env:GITHUB_WORKSPACE '.claude-plugin/plugin.json') -Raw | ConvertFrom-Json
          $matchesPlugin = @($installed | Where-Object { $_.id -eq 'codebook@codebook' -and $_.enabled -and $_.version -eq $package.version })
          if ($matchesPlugin.Count -ne 1) { throw 'The released plugin was not installed and enabled.' }
          $helpText = (& $claude --strict-mcp-config --mcp-config $emptyMcp -p '/factory help') -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0 -or $helpText -notmatch '/factory backlog' -or $helpText -notmatch '/factory report') {
            throw 'An installed plugin must display its factory commands offline.'
          }
          Write-Host "Verified installed CodeBook $($package.version) and /factory help."
