name: Factory plugin on Windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run the native Claude Code plugin tests
        shell: pwsh
        run: |
          $cli = Join-Path $env:RUNNER_TEMP 'factory-plugin-cli'
          npm install --prefix $cli --no-audit --no-fund @anthropic-ai/claude-code@2.1.325
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $claude = Join-Path $cli 'node_modules/.bin/claude.cmd'
          & $claude --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $claude plugin test .
          exit $LASTEXITCODE
